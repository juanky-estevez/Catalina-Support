server {
    listen 8080;
    server_name _;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /v1/chat/completions {
        default_type application/json;
        return 200 '{"choices":[{"message":{"content":"{\\\"text\\\":\\\"connection ok\\\"}"}}]}';
    }
}
