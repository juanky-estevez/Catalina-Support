# Vhost de desarrollo de Catalina-Support.
#
# Se copia a /etc/nginx/conf.d/ de la máquina y se recarga nginx:
#
#   sudo cp config/nginx/catalina-support-dev.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx es la puerta de entrada en desarrollo y en producción: por eso el frontend llama a
# /api/** en relativo y nunca a un host (docs/arquitectura.md, secciones 4 y 9).
#
# IMPORTANTE: este vhost NO incluye /etc/nginx/snippets/common-security.conf, por el mismo
# motivo que el de Calibyou: ese snippet está pensado para tráfico público de producción y
# rompe el servidor de desarrollo de Angular (que es Vite por dentro).
#
#   1) Devuelve 444 a cualquier ruta con un segmento que empiece por punto:
#        if ($uri ~* "(?:^|/)\.(?!well-known(?:/|$))") { return 444; }
#      El servidor de desarrollo sirve dependencias pre-empaquetadas desde rutas con punto,
#      de modo que el SPA no arranca (página en blanco).
#
#   2) Aplica limit_req (20 r/s, burst 60) y limit_conn (30 conexiones): el servidor de
#      desarrollo sirve cientos de módulos en ráfaga y las peticiones empezarían a recibir 503.
#
# Se conservan las cabeceras de seguridad y los bloqueos de métodos y rutas basura.

upstream catalina_support_dev_frontend {
    server 127.0.0.1:11001;
}

upstream catalina_support_dev_backend {
    server 127.0.0.1:11002;
}

# Zona de límite para el login y para pedir el correo de recuperación: son las dos únicas
# rutas públicas que reciben credenciales o provocan el envío de un correo, y sin límite se
# les puede probar contraseñas a gusto o usar el sistema para enviar correo a terceros.
# Es el mismo criterio que en Calibyou. El resto del tráfico no lleva límite: el servidor de
# desarrollo de Angular pide cientos de módulos en ráfaga y recibiría 503.
limit_req_zone $binary_remote_addr zone=catalina_support_dev_login:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name dev.catalina-support.example.com;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.catalina-support.example.com;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP de desarrollo: más permisiva que la de producción porque el servidor de Angular
    # inyecta un script en línea y abre un websocket para el recambio en caliente.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-src 'self' blob:; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    if ($request_method ~* ^(TRACE|TRACK|CONNECT)$) {
        return 405;
    }

    if ($uri ~* "\.(?:php[0-9]?|phtml|phar|asp|aspx|cgi|pl)(?:/|$)") {
        return 444;
    }

    ssl_certificate /etc/letsencrypt/live/dev.catalina-support.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.catalina-support.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Los adjuntos pueden llegar hasta 25 MB (docs/tickets.md). nginx trae 1 MB por
    # defecto y rechazaría con un 413 cualquier archivo de más de un mega antes de que
    # llegue al backend; los 30 dejan margen sobre el límite del archivo.
    client_max_body_size 30m;

    # Login y "he olvidado la contraseña": con límite, y pasando la ruta TAL CUAL (el
    # backend expone /api/auth/...). Una petición por segundo por IP, con margen de 5.
    location = /api/auth/login {
        limit_req zone=catalina_support_dev_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://catalina_support_dev_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/password/forgot {
        limit_req zone=catalina_support_dev_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://catalina_support_dev_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Al backend se le pasa la ruta TAL CUAL, sin quitar /api: las rutas del backend ya
    # llevan el prefijo (/api/<módulo>/...), a diferencia de Calibyou, que lo reescribe.
    location /api/ {
        proxy_pass http://catalina_support_dev_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
    }

    location / {
        proxy_pass http://catalina_support_dev_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El servidor de desarrollo responde sin content-length y en flujo continuo: con el
        # buffering por defecto nginx escribe a un archivo temporal y añade latencia.
        proxy_buffering off;

        # El recambio en caliente usa un websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
    }
}
