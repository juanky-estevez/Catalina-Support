# nginx del contenedor de frontend en producción: sirve los archivos estáticos que ha
# construido builder_frontend. La API no pasa por aquí, la enruta el vhost del servidor
# (docs/ambientes.md).
server {
    listen 21001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El index no se cachea: si no, el navegador sigue abriendo un bundle viejo.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Los bundles de Angular llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplicación de una sola página: cualquier ruta desconocida la resuelve Angular.
    location / {
        try_files $uri /index.html;
    }
}
