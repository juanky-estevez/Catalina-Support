# Vhost de producción de Catalina-Support.
#
# Se copia a /etc/nginx/conf.d/ de la máquina y se recarga nginx:
#
#   sudo cp config/nginx/catalina-support-prod.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# En producción sí se incluye el snippet común de seguridad: aquí no hay servidor de
# desarrollo que se rompa, y el tráfico es público.

upstream catalina_support_prod_frontend {
    server 127.0.0.1:21001;
}

upstream catalina_support_prod_backend {
    server 127.0.0.1:21002;
}

# Zona de límite para el login y para pedir el correo de recuperación: son las dos únicas
# rutas públicas que reciben credenciales o provocan el envío de un correo, y sin límite se
# les puede probar contraseñas a gusto o usar el sistema para enviar correo a terceros.
# Es el mismo criterio que en Calibyou. El resto del tráfico no lleva límite: el servidor de
# desarrollo de Angular pide cientos de módulos en ráfaga y recibiría 503.
limit_req_zone $binary_remote_addr zone=catalina_support_prod_login:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name catalina-support.calibyou.com;

    include /etc/nginx/snippets/common-security.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name catalina-support.calibyou.com;

    # Los adjuntos pueden llegar hasta 25 MB (docs/tickets.md); nginx trae 1 MB por
    # defecto y rechazaría con un 413 cualquier archivo mayor antes de llegar al backend.
    client_max_body_size 30m;

    # Login y "he olvidado la contraseña": con límite, y pasando la ruta TAL CUAL (el
    # backend expone /api/auth/...). Una petición por segundo por IP, con margen de 5.
    location = /api/auth/login {
        limit_req zone=catalina_support_prod_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://catalina_support_prod_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/password/forgot {
        limit_req zone=catalina_support_prod_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://catalina_support_prod_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    include /etc/nginx/snippets/common-security.conf;
    # CSP estricta: el frontend de producción es un build estático sin scripts en línea y sin
    # eval. js/css salen del propio dominio y Angular marca los assets con hash, así que no
    # hace falta nada externo.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'self' blob:; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    ssl_certificate /etc/letsencrypt/live/catalina-support.calibyou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catalina-support.calibyou.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Al backend se le pasa la ruta TAL CUAL, sin quitar /api: las rutas del backend ya
    # llevan el prefijo (/api/<módulo>/...), a diferencia de Calibyou, que lo reescribe.
    #
    # Mientras la producción esté aplazada esto devuelve 502 (no hay backend detrás). Se
    # deja montado a propósito, porque nadie consume /api/ durante la pausa y así el día
    # del despliegue sólo hay que restaurar el bloque de arriba.
    location /api/ {
        proxy_pass http://catalina_support_prod_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
    }

    # ---------------------------------------------------------------------------------
    # APLAZADO HASTA CERRAR LA VERSIÓN 1.0.0 (decisión del responsable, 2026-09-22).
    #
    # Mientras no haya contenedores de producción, este dominio NO está en servicio, así
    # que responde 503 con un aviso en lugar del 502 que da nginx cuando no hay nada
    # detrás: un 502 parece una web rota, y esto parece lo que es, algo que aún no está.
    #
    # CUANDO SE DESPLIEGUE: sustituir este bloque por el proxy al contenedor de frontend
    # (está justo debajo, comentado).
    #
    # No lleva add_header: si lo llevara, nginx dejaría de heredar las cabeceras del
    # servidor (las de common-security.conf y la CSP), porque las directivas add_header de
    # un bloque anidado sustituyen a las heredadas.
    # ---------------------------------------------------------------------------------
    location / {
        default_type "text/html; charset=utf-8";
        return 503 '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Catalina Support — en desarrollo</title></head><body style="font-family:system-ui,sans-serif;margin:4rem auto;max-width:34rem;line-height:1.6;color:#1f2937"><h1 style="font-size:1.4rem">Catalina Support</h1><p>Esta versión todavía está en desarrollo y el servicio aún no está disponible.</p><p style="color:#6b7280">Lo estará al cerrar la versión 1.0.0.</p></body></html>';
    }

    # Cuando se despliegue la 1.0.0, este es el bloque que sustituye al aviso de arriba:
    #
    # location / {
    #     proxy_pass http://catalina_support_prod_frontend;
    #     proxy_http_version 1.1;
    #
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #
    #     proxy_read_timeout 300;
    #     proxy_connect_timeout 60;
    #     proxy_send_timeout 300;
    # }
}
