name: catalina-support-prod

# Producción, con la misma forma que Calibyou: contenedores "finos" (el runtime vive en
# imágenes base y el código son artefactos construidos) y los builders bajo el perfil
# "build", que NO se levantan con "up".
#
#   docker compose -f prod.yml --profile build run --rm builder_backend
#   docker compose -f prod.yml --profile build run --rm builder_frontend
#   docker compose -f prod.yml up -d
#
# PENDIENTE: los puertos 21001-21003, el dominio, el TLS y las rutas de artefactos
# (/root/prod/catalina-support) tienen que confirmarse en docs/ambientes.md antes del
# primer despliegue. Este archivo todavía no se ha probado en un servidor.
#
# El despliegue a producción está APLAZADO hasta cerrar la versión 1.0.0 (decisión del
# responsable, 2026-09-22): durante el desarrollo sólo se trabaja contra el entorno de
# desarrollo (dev.yml). El vhost y el certificado de producción ya están puestos, así que hoy
# https://catalina-support.calibyou.com responde 503 con un aviso de que está en desarrollo.

# **Las rutas de los volúmenes son relativas al propio archivo** (decisión del responsable,
# 2026-09-30): así el despliegue funciona desde cualquier carpeta y en cualquier sistema, y no hay
# ninguna ruta de esta máquina escrita en el repositorio. Para eso **este archivo se copia a la carpeta
# de despliegue** y el despliegue se ejecuta desde ahí: `scripts/prod-build.sh` lo publica junto a los
# artefactos y a `config/`, y levanta el compose **desde esa carpeta**. `./frontend` es entonces
# `/root/prod/catalina-support/frontend`, que es exactamente lo que era antes.
services:
  frontend:
    restart: always
    container_name: catalina_support_prod_frontend
    image: nginx:1.27-alpine
    ports:
      - 21001:21001
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./config/nginx/frontend.prod.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    restart: always
    container_name: catalina_support_prod_backend
    build:
      context: .
      dockerfile: config/dockerfiles/prod_backend_runtime.Dockerfile
    image: catalina-support-prod-backend-runtime
    env_file:
      - ./config/env/prod.env
    working_dir: /app
    command: ["/app/catalina-support"]
    depends_on:
      database:
        condition: service_healthy
    ports:
      - 21002:21002
    volumes:
      - ./backend:/app:ro
      - ./_logs:/logs
      - ./_files:/files
    networks:
      # El motor de IA: **el mismo contenedor que usa desarrollo**, en su propio compose (`ai.yml`),
      # porque dos modelos no caben en esta máquina (`docs/modules/ai.md`, decisión 1).
      - default
      - catalina-support-ai

  database:
    image: postgres:18-alpine
    container_name: catalina_support_prod_database
    restart: always
    env_file:
      - ./config/env/prod.env
    ports:
      - 21003:21003
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p 21003"]
      interval: 5s
      timeout: 5s
      retries: 12

  builder_frontend:
    profiles: ["build"]
    container_name: catalina_support_prod_builder_frontend
    build:
      context: .
      dockerfile: config/dockerfiles/prod_frontend_builder.Dockerfile
    volumes:
      - ./frontend:/out
    # Angular publica en dist/<proyecto>/browser. Sin "rm -rf /out/*": se copia encima
    # de lo existente para que nginx no sirva un 404 entre el bundle nuevo y el index
    # nuevo; los assets con hash del build anterior se podan después de copiar.
    command:
      - sh
      - -lc
      - |
        set -eu
        cp -r /frontend/dist/catalina-support/browser/. /out/
        cd /out
        for f in assets/*; do [ -e "/frontend/dist/catalina-support/browser/$$f" ] || rm -f "$$f"; done
        echo "--- artefacto frontend ---"
        ls -la /out

  builder_backend:
    profiles: ["build"]
    container_name: catalina_support_prod_builder_backend
    build:
      context: .
      dockerfile: config/dockerfiles/prod_backend_builder.Dockerfile
    volumes:
      - ./backend:/out
    # mv (rename) en vez de cp sobre el binario en ejecución: evita ETXTBSY y deja el
    # proceso actual corriendo sobre el inodo viejo hasta el restart.
    command:
      - sh
      - -lc
      - |
        set -eu
        rm -f /out/catalina-support.new
        cp /build/catalina-support /out/catalina-support.new
        chmod 755 /out/catalina-support.new
        mv -f /out/catalina-support.new /out/catalina-support
        echo "--- artefacto backend ---"
        ls -la /out

networks:
  # La red del motor de IA, creada por `ai.yml`: aquí sólo se entra en ella.
  catalina-support-ai:
    # **No es externa: la crea el primero que arranca.** Con un nombre fijo, los tres archivos
    # apuntan a la misma red, y el primero que se levanta la crea y los demás entran en ella. Así
    # `docker compose -f dev.yml up -d` **funciona en una máquina nueva** sin crear nada a mano, que
    # es lo que fallaba (y sin guiones: esto vale igual en Windows).
    name: catalina-support-ai

volumes:
  database:
    name: catalina_support_prod_database
