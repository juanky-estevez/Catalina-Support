name: catalina-support-dev

# Desarrollo: los servicios con el código montado como volumen, de modo que se edita
# en la máquina y el contenedor recarga (Angular con su servidor de desarrollo, Go con
# air). No hace falta Go ni Node instalados en la máquina.
#
#   docker compose -f dev.yml up -d
#   docker compose -f dev.yml logs -f backend
#   docker compose -f dev.yml exec backend go test ./...
#
# Los puertos publicados son 11001-11006 (no los 10001-10004 de Calibyou) para que los
# dos proyectos puedan estar levantados a la vez; los dos últimos —11005, el directorio de
# pruebas, y 11006, Keycloak— los publican sus propios archivos (`active-directory.yml` y
# `keycloak.yml`), que entran en la red de este entorno. Se publican sin dirección de escucha.
#
# `mail` es el buzón de pruebas: recoge todo el correo que manda la aplicación y lo
# enseña en http://127.0.0.1:11004. Sin él no se puede completar el alta de una cuenta
# local en desarrollo, porque la contraseña se establece desde el enlace del correo.

services:
  frontend:
    restart: always
    container_name: catalina_support_dev_frontend
    build:
      context: .
      dockerfile: config/dockerfiles/frontend.Dockerfile
    # Los hosts admitidos por el servidor de desarrollo están en angular.json
    # (serve.options.allowedHosts): el CLI no acepta la lista por línea de comandos y, sin
    # ella, el servidor de Angular rechaza con 403 el Host del dominio de desarrollo.
    command: ["npm", "start", "--", "--host", "0.0.0.0", "--port", "11001"]
    ports:
      - 11001:11001
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    restart: always
    container_name: catalina_support_dev_backend
    build:
      context: .
      dockerfile: config/dockerfiles/backend.Dockerfile
    env_file:
      - ./config/env/dev.env
    environment:
      # Sugerencias exclusivas del paso 4 de /setup en una instalación todavía vacía. El usuario
      # puede cambiarlas y sólo pasan a ser configuración al guardar el paso.
      SETUP_MAIL_HOST: mail
      SETUP_MAIL_PORT: "1025"
      SETUP_MAIL_SECURE: "false"
      SETUP_MAIL_USER: ""
      SETUP_MAIL_FROM_NAME: Catalina Support
      SETUP_MAIL_FROM_EMAIL: no-responder@catalina-support.local
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 11002:11002
    volumes:
      - ./backend:/app
      - ./_logs:/logs
      - ./_files:/files
      - backend_go_mod:/go/pkg/mod
      - backend_go_build:/root/.cache/go-build
    networks:
      # El motor de IA vive en su propio compose (`ai.yml`) porque **un solo contenedor sirve a
      # desarrollo y a producción**: no caben dos modelos en esta máquina. Se entra a él por esta
      # red, que existe fuera de aquí (`docs/modules/ai.md`, decisión 1).
      - default
      - catalina-support-ai

  # Buzón de pruebas: nada de lo que salga de aquí va a ningún destinatario real. Su
  # puerto 1025 es el SMTP al que apunta dev.env, y el 8025 es la web donde se leen los
  # correos (publicado en 11004 para no chocar con Calibyou).
  mail:
    image: axllent/mailpit:latest
    container_name: catalina_support_dev_mail
    restart: always
    ports:
      - 11004:8025
    environment:
      MP_MAX_MESSAGES: 200
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Las pruebas de navegador viven en tests.yml y no usan esta instalación.

  database:
    image: postgres:18-alpine
    container_name: catalina_support_dev_database
    restart: always
    env_file:
      - ./config/env/dev.env
    ports:
      - 11003:11003
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p 11003"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Los datos de ejemplo de desarrollo: once cuentas, 25 tickets con su historia y sus adjuntos.
  # **Es opcional** —quien quiera probar el proyecto vacío, sólo con el esquema, no lo ejecuta— y
  # **no se levanta con `up -d`**: tiene perfil propio y se pide a propósito:
  #
  #   docker compose -f dev.yml run --rm seed
  #
  # Es **un contenedor que se ejecuta y se va**, con la misma imagen que la base —`psql` y `bash` ya
  # vienen dentro—, y corre **el guion de siempre, `scripts/dev-seed.sh`**: una sola verdad sobre
  # cómo se siembra, y el mismo comando en Linux, macOS y Windows (docs/ambientes.md, sección 3.3).
  # El guion aplica el esquema (idempotente), los ejemplos y copia los adjuntos de `config/seed/` a
  # `_files/`, en la carpeta de su ticket.
  #
  # Los montajes son exactamente lo que el guion necesita: el guion, las migraciones y `config/`
  # (la semilla y el entorno) **de sólo lectura**, y `_files/` **de escritura**, que es lo único que
  # el guion modifica en la máquina. El `entrypoint` se sustituye para correr el guion, y con él el
  # contenedor no pasa por el arranque de PostgreSQL (no levanta ninguna base: la siembra es la de
  # `database`).
  # Sólo el esquema: no borra, no carga ejemplos y no sella una base nueva.
  migrate:
    image: postgres:18-alpine
    env_file: [./config/env/dev.env]
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    entrypoint: ["sh", "-ec"]
    command:
      - |
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        psql -h "$$POSTGRES_HOST" -p "$$PGPORT" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -f /migrations/v1.0.0.sql
        echo "Esquema aplicado; los ejemplos siguen siendo opcionales."

  seed:
    image: postgres:18-alpine
    container_name: catalina_support_dev_seed
    profiles: ["seed"]
    working_dir: /app
    entrypoint: ["bash", "scripts/dev-seed.sh"]
    environment:
      # La marca con la que el guion sabe que corre dentro del contenedor: habla con la base por la
      # red del entorno con el `psql` de la imagen, sin necesitar docker dentro.
      SEED_EN_CONTENEDOR: "1"
    env_file:
      - ./config/env/dev.env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./scripts:/app/scripts:ro
      - ./backend/migrations:/app/backend/migrations:ro
      - ./config:/app/config:ro
      - ./_files:/app/_files

networks:
  # **La red del entorno de desarrollo, con nombre fijo.** La crea este archivo (sin `external`) y
  # los elementos que viven aparte —`active-directory.yml` y `keycloak.yml`— la declaran **externa**
  # y entran en ella, con el nombre de servicio por alias (`ldap`, `keycloak`): así el backend los
  # alcanza por su nombre **sin que estén en este archivo**, y levantar el entorno en una máquina
  # nueva sigue siendo un solo comando.
  default:
    name: catalina-support-dev
  catalina-support-ai:
    # **No es externa: la crea el primero que arranca.** Con un nombre fijo, los tres archivos
    # apuntan a la misma red, y el primero que se levanta la crea y los demás entran en ella. Así
    # `docker compose -f dev.yml up -d` **funciona en una máquina nueva** sin crear nada a mano, que
    # es lo que fallaba (y sin guiones: esto vale igual en Windows).
    name: catalina-support-ai

volumes:
  frontend_node_modules:
    name: catalina_support_dev_frontend_node_modules
  backend_go_mod:
    name: catalina_support_dev_backend_go_mod
  backend_go_build:
    name: catalina_support_dev_backend_go_build
  database:
    name: catalina_support_dev_database
