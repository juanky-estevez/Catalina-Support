name: catalina-support-tests

# Instancia desechable. No publica puertos ni comparte datos con dev.yml o prod.yml.
services:
  database:
    image: postgres:18-alpine
    env_file: [./config/env/dev.env]
    volumes: [database:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p 11003']
      interval: 2s
      timeout: 5s
      retries: 60
  migrate:
    image: postgres:18-alpine
    env_file: [./config/env/dev.env]
    depends_on:
      database: {condition: service_healthy}
    volumes: [./backend/migrations:/migrations:ro]
    entrypoint: [sh, -ec]
    command:
      - |
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        psql -h database -p "$$PGPORT" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -f /migrations/v1.0.0.sql
  mail:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
  ai-test:
    image: nginx:1.27-alpine
    volumes:
      - ./config/nginx/ai.tests.conf:/etc/nginx/conf.d/default.conf:ro
  frontend:
    networks:
      default:
        aliases: [frontend.localhost]
    build:
      context: .
      dockerfile: config/dockerfiles/frontend.Dockerfile
    command: [npm, start, --, --host, 0.0.0.0, --port, '11001']
    volumes:
      - ./frontend:/app:ro
      - frontend_node_modules:/app/node_modules
      - frontend_cache:/app/.angular
  backend:
    build:
      context: .
      dockerfile: config/dockerfiles/backend.Dockerfile
    # La suite es inmutable durante una pasada: no necesita la recarga de Air. `go run` compila una
    # vez usando las cachés montadas fuera de /app y permite conservar el código en sólo lectura.
    command: [go, run, .]
    env_file: [./config/env/dev.env]
    environment:
      PUBLIC_APP_URL: http://frontend.localhost:11001
      AI_URL: ''
      AI_CREDENTIAL_KEY: i32lYVpxAST1wiiVLf+pNTUtexhWfmUVQF86GDtPOn0=
      AI_MANAGER_TOKEN: catalina-support-tests-ai-manager
      AI_MODEL: ''
    depends_on:
      migrate: {condition: service_completed_successfully}
      ai-test: {condition: service_started}
    volumes:
      - ./backend:/app:ro
      - backend_go_mod:/go/pkg/mod
      - backend_go_build:/root/.cache/go-build
      - logs:/logs
      - files:/files
  ldap:
    image: osixia/openldap:1.5.0
    profiles: [directory]
    environment:
      LDAP_ORGANISATION: Catalina Support
      LDAP_DOMAIN: ejemplo.com
      LDAP_ADMIN_PASSWORD: admin-directorio
      LDAP_SEED_INTERNAL_LDIF_PATH: /ldifs
      LDAP_REMOVE_CONFIG_AFTER_SETUP: 'true'
      LDAP_NOFILE: '1024'
    volumes: [./config/ldap:/ldifs:ro]
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: [directory]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-keycloak
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /sso
      KC_HOSTNAME: http://keycloak:8080/sso
    volumes: [./config/keycloak:/opt/keycloak/data/import:ro]
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /e2e
    env_file: [./config/env/dev.env]
    environment:
      BASE_URL: http://frontend.localhost:11001
      MAILPIT_URL: http://mail:8025
      ISOLATED_TESTS: '1'
    depends_on:
      backend: {condition: service_started}
      frontend: {condition: service_started}
      mail: {condition: service_started}
    volumes:
      - ./tests/e2e:/e2e:ro
      - e2e_node_modules:/e2e/node_modules
      - ./tests/e2e/resultados:/resultados
    entrypoint: [sh, -ec]
    command: ['npm ci && npx playwright test']

volumes:
  database:
  frontend_node_modules:
  frontend_cache:
  backend_go_mod:
  backend_go_build:
  files:
  logs:
  e2e_node_modules:
